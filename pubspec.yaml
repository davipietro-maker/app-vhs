name: app_vhs
description: Aplicativo de camera estilo VHS com filtros em tempo real.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  flutter_shaders: ^0.1.3
  ffmpeg_kit_flutter_new: ^1.6.1
  gal: ^2.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  shaders:
    - shaders/vhs.frag

  fonts:
    - family: VcrOsdMono
      fonts:
        - asset: assets/fonts/VCR_OSD_MONO.ttf
